name: Deploy NexoBot

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/nexobot
            git pull origin main
            docker compose up -d --build
            sleep 10
            DB_PASS=$(grep DB_PASSWORD .env | cut -d= -f2)
            DATABASE_URL="postgresql://nexobot:${DB_PASS}@127.0.0.1:5432/nexobot?schema=public" npx prisma@6 db push --accept-data-loss
            docker compose ps
            echo "Deploy complete!"
